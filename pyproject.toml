[project]
name = "claude-flow"
version = "0.1.0"
description = "Saved, versioned procedures (flows) that Claude Code runs instead of improvising"
readme = "README.md"
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE.md"]
dependencies = ["pyyaml>=6"]

[project.scripts]
flow = "flowkit.cli:entry"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flowkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
